[package]
name = "npc-render-bench"
version = "0.1.0"
edition = "2021"
description = "2D/3D NPC 大规模实时渲染基准（wgpu + winit）"
publish = false

[dependencies]
wgpu = "30"
winit = "0.30"
pollster = "1.0"

[[bin]]
name = "npc3d"
path = "src/bin/npc3d.rs"

[[bin]]
name = "npc2d"
path = "src/bin/npc2d.rs"

[[bin]]
name = "video"
path = "src/bin/video.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "raster"
path = "src/bin/raster.rs"

[[bin]]
name = "raster2d"
path = "src/bin/raster2d.rs"

[[bin]]
name = "raster3d"
path = "src/bin/raster3d.rs"

[[bin]]
name = "mushroom"
path = "src/bin/mushroom.rs"

[[bin]]
name = "mushroom_gpu"
path = "src/bin/mushroom_gpu.rs"

[[bin]]
name = "mushroom_vol"
path = "src/bin/mushroom_vol.rs"

[profile.release]
opt-level = 3
lto = "thin"
